<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Furniture Store</title>
  </head>
  <body>
    <h1>Check Furniture Price</h1>
    <input type="text" id="itemInput" placeholder="Enter item name" />
    <button id="checkPriceBtn">Check Price</button>
    <p id="result"></p>

    <h1>Buy Furniture</h1>
    <input type="text" id="buyInput" placeholder="Enter item name to buy" />
    <button id="buyBtn">Buy Item</button>
    <p id="buyResult"></p>

    <h2>Your money: $<span id="money">500</span></h2>

    <script src="main.js"></script>
  </body>
</html>
